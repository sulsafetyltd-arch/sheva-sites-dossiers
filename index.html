<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>תיק שטח כיבוי אש</title>
    <meta name="description" content="ניהול תיקי שטח לבטיחות אש" />
    <meta name="theme-color" content="#0f2744" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="תיק שטח" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" data-brand-slot="apple-touch" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" data-brand-slot="favicon-32" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" data-brand-slot="favicon-48" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192.png" data-brand-slot="favicon-192" />
    <link rel="icon" type="image/svg+xml" href="./safety-app-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply SOLO / safety branding before React loads when opening /safety
      // so iOS "Add to Home Screen" picks the correct icon for photo reports.
      (function () {
        try {
          var path = location.pathname || '';
          var isSafety = /(?:^|\/)safety(?:\/|$)/.test(path);
          if (!isSafety) return;
          document.title = 'סול בטיחות — דוחות מצולמים';
          var desc = document.querySelector('meta[name="description"]');
          if (desc) desc.setAttribute('content', 'הכנת דוחות ביקורת בטיחות עם צילום וזיהוי ליקויים');
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute('content', '#000000');
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', 'סול בטיחות');
          var map = {
            'apple-touch': './safety-apple-touch-icon.png',
            'favicon-32': './safety-favicon-32.png',
            'favicon-48': './safety-favicon-48.png',
            'favicon-192': './safety-pwa-192.png'
          };
          Object.keys(map).forEach(function (slot) {
            var el = document.querySelector('link[data-brand-slot="' + slot + '"]');
            if (el) el.setAttribute('href', map[slot]);
          });
        } catch (e) {}
      })();
    </script>
    <script>
      // One-shot PWA recovery after oversized precache broke iOS installs.
      // Bump SOL_PWA_BUILD whenever clients may be stuck on a stale shell.
      (function () {
        var BUILD = '2026-07-28-safety-icon-split';
        var KEY = 'sol-pwa-build';
        var FLAG = 'sol-pwa-reloaded-' + BUILD;
        try {
          var params = new URLSearchParams(location.search);
          var force = params.has('resetpwa');
          var prev = localStorage.getItem(KEY);
          if (!force && prev === BUILD) return;
          localStorage.setItem(KEY, BUILD);
          var finish = function () {
            if (force) {
              params.delete('resetpwa');
              var next = location.pathname + (params.toString() ? '?' + params.toString() : '') + location.hash;
              location.replace(next || '/safety');
              return;
            }
            if (!sessionStorage.getItem(FLAG)) {
              sessionStorage.setItem(FLAG, '1');
              location.reload();
            }
          };
          var clearCaches = function () {
            if (!window.caches || !caches.keys) return Promise.resolve();
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          };
          if (!('serviceWorker' in navigator)) {
            clearCaches().then(finish);
            return;
          }
          navigator.serviceWorker.getRegistrations()
            .then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
            .then(clearCaches)
            .then(finish)
            .catch(finish);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
